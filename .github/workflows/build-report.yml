name: Build malware analysis report

on:
  push:
    branches: ["feat/malware-analysis-v2"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build and validation dependencies
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7 pillow==11.3.0 reportlab==4.4.9 pyyaml==6.0.2 yara-python==4.5.4

      - name: Validate source files
        shell: bash
        run: |
          python -m py_compile report/build_report.py
          python -m json.tool report/report_data.json >/dev/null
          python -m json.tool iocs/iocs.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('detection/sigma').glob('*.yml')):
              data = yaml.safe_load(path.read_text(encoding='utf-8'))
              assert isinstance(data, dict) and data.get('title') and data.get('detection'), path
              print('sigma ok:', path)
          PY
          python - <<'PY'
          import yara
          rules = yara.compile(filepath='detection/mydoom_family.yar')
          print('yara ok:', rules)
          PY

      - name: Build PDF and QA contact sheet
        run: python report/build_report.py

      - name: Enforce report QA
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          qa = json.loads(Path('report/qa.json').read_text())
          assert qa['page_count'] >= 10, qa
          assert not qa['issues'], qa['issues']
          assert Path('MyDoom_Malware_Analysis_and_Detection_Report_v2.pdf').stat().st_size > 100_000
          print('QA PASS:', qa['page_count'], 'pages')
          PY

      - name: Commit generated report on branch builds
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MyDoom_Malware_Analysis_and_Detection_Report_v2.pdf report/qa.json report/preview_contact_sheet.b64
          git commit -m "build: generate MyDoom v2 report [skip ci]" || exit 0
          git push
