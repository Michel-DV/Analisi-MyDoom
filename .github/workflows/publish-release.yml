name: Publish portfolio release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish v2.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: b46b047571305cdb7e72ddb0f00f09a195ba9f0d
        run: |
          tag="v2.0.0"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$TARGET_SHA"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "MyDoom Malware Analysis & Detection Engineering v2.0.0" --notes "Portfolio release of the MyDoom malware-analysis and detection-engineering package: professional report, YARA and Sigma detections, machine-readable IOCs, ATT&CK mapping, detection guidance, incident-response notes, reproducible report build and CI QA."
          fi
