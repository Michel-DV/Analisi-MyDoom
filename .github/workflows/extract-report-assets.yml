name: Finish report asset migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Ensure selected evidence figures are self-contained source assets
        shell: bash
        run: |
          git show cb984bee165b476fb7fc21b66fe145943be44d23:"Analisi Tecnica del Malware MyDoom.pdf" > /tmp/legacy-mydoom.pdf
          python -m pip install --disable-pip-version-check pymupdf==1.26.7
          python - <<'PY'
          from pathlib import Path
          import fitz

          source = Path('/tmp/legacy-mydoom.pdf')
          target = Path('report/assets')
          target.mkdir(parents=True, exist_ok=True)
          doc = fitz.open(source)
          pages = {2: 1, 5: 1, 6: 2, 7: 1, 9: 2, 11: 3, 14: 1}
          for page_no, count in pages.items():
              images = doc[page_no - 1].get_images(full=True)
              if len(images) < count:
                  raise SystemExit(f'page {page_no}: expected {count} images, found {len(images)}')
              for index, image in enumerate(images[:count], start=1):
                  info = doc.extract_image(image[0])
                  ext = info.get('ext', 'bin')
                  (target / f'p{page_no}_{index}.{ext}').write_bytes(info['image'])
          PY

      - name: Make report builder independent of the legacy PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('report/build_report.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "SOURCE = ROOT / 'Analisi Tecnica del Malware MyDoom.pdf'",
              "SOURCE_ASSETS = ROOT / 'report' / 'assets'",
          )
          replacement = '''def source_images():
    keys = ('p2_1','p5_1','p6_1','p6_2','p7_1','p9_1','p9_2','p11_1','p11_2','p11_3','p14_1')
    out = {}
    for key in keys:
        matches = sorted(SOURCE_ASSETS.glob(f'{key}.*'))
        if not matches:
            raise SystemExit(f'missing maintained report asset: {key}')
        out[key] = matches[0]
    return out
'''
          text, count = re.subn(
              r"def source_images\(\):\n.*?\n    return out\n",
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('could not replace source_images()')
          text = text.replace(
              "    if not SOURCE.exists(): raise SystemExit(f'missing source PDF: {SOURCE}')\n    BUILD.mkdir(exist_ok=True); figs=source_images();",
              "    BUILD.mkdir(exist_ok=True); figs=source_images();",
          )
          if 'SOURCE)' in text or 'fitz.open(SOURCE)' in text:
              raise SystemExit('legacy source dependency still present')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit self-contained report source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/assets report/build_report.py
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "report: make v2 build self-contained"
          git push origin HEAD:main
